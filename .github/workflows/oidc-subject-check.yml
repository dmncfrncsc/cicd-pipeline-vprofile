name: oidc-subject-check

on:
  workflow_dispatch:

permissions: {}

jobs:
  show-subject:
    runs-on: ubuntu-24.04
    environment:
      name: production
      deployment: false
    permissions:
      id-token: write
    steps:
      - name: Print only the OIDC subject claim
        shell: bash
        run: |
          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "No token returned" >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d | jq -r '.sub'
