name: Deploy

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: EC2 instance ID of the ephemeral host
        required: true
        type: string
      force_failure:
        description: Test only. Fail a health check on purpose to test the rollback
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      INSTANCE_ID: ${{ inputs.instance_id }}
      FORCE_FAILURE: ${{ inputs.force_failure }}
      WAR_PATH: build-work/target/vprofile-v2.war
    steps:
      - name: Check out repository and pinned submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test
        run: bash scripts/build.sh

      - name: Check the instance ID format
        run: |
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]] || { echo "Bad instance ID"; exit 1; }

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: p3-deploy-${{ github.run_id }}
          aws-region: us-east-1

      - name: Confirm the assumed role without printing it
        run: |
          aws sts get-caller-identity --query Arn --output text \
            | grep -q 'assumed-role/p3-vprofile-deploy/'

      - name: Upload the WAR to the private bucket
        run: aws s3 cp "$WAR_PATH" "s3://p3-vprofile-war-k7m3q9/vprofile-v2.war"

      - name: Install the Session Manager plugin
        run: |
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "$RUNNER_TEMP/ssm-plugin.deb"
          sudo dpkg -i "$RUNNER_TEMP/ssm-plugin.deb"

      - name: Install Ansible and collections
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install ansible-core==2.21.4 boto3
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/ansible-galaxy" collection install \
            amazon.aws:==11.4.0 ansible.mysql:==5.2.0 community.rabbitmq:==1.7.0

      - name: Write the deploy variables
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RMQ_PASSWORD: ${{ secrets.RMQ_PASSWORD }}
        run: |
          umask 077
          jq -n --arg db "$DB_PASSWORD" --arg rmq "$RMQ_PASSWORD" \
            --arg war "$GITHUB_WORKSPACE/$WAR_PATH" \
            '{db_password:$db, rmq_password:$rmq, war_path:$war}' > "$RUNNER_TEMP/vars.json"

      - name: Deploy over SSM
        run: |
          ansible-playbook ansible/deploy.yml \
            -i "$INSTANCE_ID," \
            -e ansible_connection=amazon.aws.aws_ssm \
            -e ansible_aws_ssm_bucket_name=p3-vprofile-ansible-transfer-k7m3q9 \
            -e ansible_aws_ssm_region=us-east-1 -e force_failure="$FORCE_FAILURE" \
            -e @"$RUNNER_TEMP/vars.json"

      - name: Remove the variables file
        if: always()
        run: rm -f "$RUNNER_TEMP/vars.json"
